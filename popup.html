
<!DOCTYPE html>
<html>
<head>
    <title>ClipVault</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <header class="header">
        <h1>ClipVault</h1>
        <p class="subtitle">Your personal collection of saved text.</p>
    </header>

    <main>
        <section class="input-section">
            <label for="clipInput">ADD A NEW CLIP</label>

            <input
                type="text"
                id="clipInput"
                placeholder="Enter text you want to save..."
            >

            <button id="saveBtn">Save clip</button>
        </section>

        <section class="clips-section">
            <div class="section-heading">
                <h2>Saved clips</h2>
                <span class="section-caption">Your collection</span>
            </div>

            <ul id="clipsList"></ul>
        </section>
    </main>

    <script src="popup.js"></script>

</body>
</html>
